<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Делитель напряжения">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Делитель напряжения</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Упрощённая электрическая схема без нагрузки на выходе.</text>
 <text x="85" y="220" fill="#ffcb81" font-size="23" font-weight="500">+9 В</text><line x1="160" y1="213" x2="238" y2="213" stroke="#ffcb81" stroke-width="4" stroke-dasharray="" marker-end=""/><rect x="238" y="188" width="125" height="50" rx="7" fill="#264d47" stroke="#9ceac2" stroke-width="3"/><text x="300" y="219" fill="#ebf8f4" font-size="22" font-weight="500" text-anchor="middle">R₁</text><line x1="363" y1="213" x2="495" y2="213" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end=""/><circle cx="495" cy="213" r="8" fill="#9ceac2" stroke="#9ceac2" stroke-width="3"/><line x1="495" y1="213" x2="594" y2="213" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end=""/><rect x="594" y="188" width="125" height="50" rx="7" fill="#264d47" stroke="#9ceac2" stroke-width="3"/><text x="656" y="219" fill="#ebf8f4" font-size="22" font-weight="500" text-anchor="middle">R₂</text><line x1="719" y1="213" x2="786" y2="213" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end=""/><line x1="786" y1="213" x2="786" y2="265" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end=""/><line x1="764" y1="265" x2="809" y2="265" stroke="#a8c0c9" stroke-width="3" stroke-dasharray="" marker-end=""/><line x1="770" y1="274" x2="802" y2="274" stroke="#a8c0c9" stroke-width="3" stroke-dasharray="" marker-end=""/><line x1="778" y1="282" x2="795" y2="282" stroke="#a8c0c9" stroke-width="3" stroke-dasharray="" marker-end=""/><line x1="495" y1="221" x2="495" y2="335" stroke="#61c7d3" stroke-width="4" stroke-dasharray="" marker-end=""/><circle cx="495" cy="335" r="9" fill="#61c7d3" stroke="#61c7d3" stroke-width="3"/><text x="498" y="366" fill="#61c7d3" font-size="20" font-weight="500" text-anchor="middle">ПИН / Vout</text><text x="478" y="160" fill="#ebf8f4" font-size="24" font-weight="700" text-anchor="middle">Uout = U · R₂/(R₁ + R₂)</text><text x="478" y="430" fill="#a8c0c9" font-size="18" font-weight="500" text-anchor="middle">Чем больше нижний R₂, тем выше напряжение на пине.</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Важный шаг: проверь, между какими узлами измеряется Vout.</text></svg>