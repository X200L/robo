<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Как выбрать формулу по условию">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Как выбрать формулу по условию</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Определи тип задачи прежде, чем начинать вычисления.</text>
 <rect x="50" y="148" width="267" height="100" rx="14" fill="#1b3a38" stroke="#476c65" stroke-width="2"/><text x="67" y="188" fill="#ebf8f4" font-size="19" font-weight="730">КОЛЁСА</text><text x="67" y="226" fill="#9ceac2" font-size="21" font-weight="500">s = πD · n</text><rect x="348" y="148" width="267" height="100" rx="14" fill="#1b3a38" stroke="#476c65" stroke-width="2"/><text x="365" y="188" fill="#ebf8f4" font-size="19" font-weight="730">ШЕСТЕРНИ</text><text x="365" y="226" fill="#9ceac2" font-size="21" font-weight="500">z₁/z₂</text><rect x="646" y="148" width="267" height="100" rx="14" fill="#1b3a38" stroke="#476c65" stroke-width="2"/><text x="663" y="188" fill="#ebf8f4" font-size="19" font-weight="730">РЫЧАГ</text><text x="663" y="226" fill="#9ceac2" font-size="21" font-weight="500">ΣM = 0</text><rect x="50" y="282" width="267" height="100" rx="14" fill="#1b3a38" stroke="#476c65" stroke-width="2"/><text x="67" y="322" fill="#ebf8f4" font-size="19" font-weight="730">ГРАФИК</text><text x="67" y="360" fill="#9ceac2" font-size="21" font-weight="500">площадь / наклон</text><rect x="348" y="282" width="267" height="100" rx="14" fill="#1b3a38" stroke="#476c65" stroke-width="2"/><text x="365" y="322" fill="#ebf8f4" font-size="19" font-weight="730">КАМЕРА</text><text x="365" y="360" fill="#9ceac2" font-size="21" font-weight="500">h = fH/Z</text><rect x="646" y="282" width="267" height="100" rx="14" fill="#1b3a38" stroke="#476c65" stroke-width="2"/><text x="663" y="322" fill="#ebf8f4" font-size="19" font-weight="730">ЦЕПЬ</text><text x="663" y="360" fill="#9ceac2" font-size="21" font-weight="500">U = IR</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Строить рисунок полезно даже к заданию, где нужно вписать одно число.</text></svg>