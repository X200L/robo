<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Маршрут дрона и векторы">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Маршрут дрона и векторы</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Сумма длины маршрута не равна расстоянию от старта.</text>
 <rect x="62" y="125" width="830" height="313" rx="14" fill="#172b34" stroke="#354b58" stroke-width="2"/><line x1="140" y1="372" x2="796" y2="372" stroke="#627c88" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="140" y1="372" x2="140" y2="163" stroke="#627c88" stroke-width="2" stroke-dasharray="" marker-end="url(#arrow)"/><text x="808" y="379" fill="#a8c0c9" font-size="19" font-weight="500">Восток (x)</text><text x="155" y="161" fill="#a8c0c9" font-size="19" font-weight="500">Север (y)</text><line x1="172" y1="348" x2="495" y2="348" stroke="#9ceac2" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M495 348 L690 151" stroke="#61c7d3" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><text x="350" y="340" fill="#9ceac2" font-size="18" font-weight="500" text-anchor="middle">4 км на восток</text><text x="638" y="223" fill="#61c7d3" font-size="18" font-weight="500">5 км, СВ</text><path d="M172 348 L690 151" stroke="#ffcb81" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="10 8" marker-end=""/><text x="380" y="213" fill="#ffcb81" font-size="19" font-weight="500">Перемещение</text><text x="385" y="424" fill="#a8c0c9" font-size="17" font-weight="500" text-anchor="middle">Сначала складывай x и y, затем применяй Пифагора.</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Северо-восток: по x и y добавляется 5/√2.</text></svg>