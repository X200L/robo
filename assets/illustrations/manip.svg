<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Двухзвенный манипулятор">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Двухзвенный манипулятор</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Конец руки зависит от суммы углов звеньев.</text>
 <line x1="210" y1="376" x2="815" y2="376" stroke="#627c88" stroke-width="3" stroke-dasharray="" marker-end=""/><circle cx="271" cy="350" r="35" fill="#274742" stroke="#5d9789" stroke-width="4"/><line x1="271" y1="350" x2="465" y2="228" stroke="#9ceac2" stroke-width="15" stroke-dasharray="" marker-end=""/><circle cx="465" cy="228" r="19" fill="#163236" stroke="#61c7d3" stroke-width="5"/><line x1="465" y1="228" x2="677" y2="177" stroke="#61c7d3" stroke-width="13" stroke-dasharray="" marker-end=""/><circle cx="677" cy="177" r="13" fill="#ffcb81" stroke="#ffcb81" stroke-width="2"/><line x1="677" y1="177" x2="700" y2="200" stroke="#ffcb81" stroke-width="5" stroke-dasharray="" marker-end=""/><text x="344" y="259" fill="#9ceac2" font-size="23" font-weight="500">L₁</text><text x="572" y="186" fill="#61c7d3" font-size="23" font-weight="500">L₂</text><path d="M331 350 A64 64 0 0 0 316 316" stroke="#ffcb81" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end=""/><text x="338" y="332" fill="#ffcb81" font-size="20" font-weight="500">θ₁</text><path d="M508 210 A48 48 0 0 1 504 254" stroke="#ffcb81" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end=""/><text x="533" y="267" fill="#ffcb81" font-size="20" font-weight="500">θ₂</text><text x="728" y="156" fill="#ffcb81" font-size="22" font-weight="500">(x, y)</text><text x="625" y="339" fill="#ebf8f4" font-size="20" font-weight="500" text-anchor="middle">x = L₁cosθ₁ + L₂cos(θ₁+θ₂)</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Вычисление положения рабочего органа — прямая кинематика.</text></svg>