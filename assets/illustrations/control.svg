<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Замкнутая система управления">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Замкнутая система управления</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Регулятор исправляет ошибку по измерениям датчика.</text>
 <rect x="53" y="185" width="205" height="106" rx="14" fill="#1c3d38" stroke="#5a9582" stroke-width="2"/><text x="155" y="240" fill="#ebf8f4" font-size="18" font-weight="750" text-anchor="middle">ЗАДАНИЕ</text><rect x="296" y="185" width="205" height="106" rx="14" fill="#1c3d38" stroke="#5a9582" stroke-width="2"/><text x="398" y="240" fill="#ebf8f4" font-size="18" font-weight="750" text-anchor="middle">РЕГУЛЯТОР</text><rect x="543" y="185" width="205" height="106" rx="14" fill="#1c3d38" stroke="#5a9582" stroke-width="2"/><text x="645" y="240" fill="#ebf8f4" font-size="18" font-weight="750" text-anchor="middle">МОТОР И РОБОТ</text><line x1="258" y1="240" x2="294" y2="240" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="501" y1="240" x2="541" y2="240" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="748" y1="240" x2="889" y2="240" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text x="843" y="217" fill="#61c7d3" font-size="18" font-weight="500">y(t)</text><path d="M805 241 L805 360 L154 360 L154 290" stroke="#ffcb81" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="582" y="327" width="180" height="60" rx="14" fill="#354134" stroke="#727d56" stroke-width="2"/><text x="672" y="366" fill="#ffcb81" font-size="20" font-weight="700" text-anchor="middle">ДАТЧИК</text><text x="385" y="150" fill="#a8c0c9" font-size="22" font-weight="500" text-anchor="middle">e(t) = задание − измерение</text><text x="40" y="458" font-size="14" fill="#a8c0c9">PID: пропорциональная, интегральная и дифференциальная составляющие.</text></svg>