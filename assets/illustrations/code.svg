<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Алгоритмы и циклы">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Алгоритмы и циклы</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Обновляй все переменные именно в том порядке, что задан.</text>
 <rect x="347" y="117" width="265" height="55" rx="14" fill="#23433e" stroke="#579b85" stroke-width="2"/><text x="479.5" y="152.5" fill="#ebf8f4" font-size="20" font-weight="650" text-anchor="middle">СТАРТ</text><rect x="347" y="209" width="265" height="68" rx="14" fill="#23433e" stroke="#579b85" stroke-width="2"/><text x="479.5" y="251.0" fill="#ebf8f4" font-size="20" font-weight="650" text-anchor="middle">ПРОВЕРИТЬ УСЛОВИЕ</text><rect x="347" y="314" width="265" height="62" rx="14" fill="#23433e" stroke="#579b85" stroke-width="2"/><text x="479.5" y="353.0" fill="#ebf8f4" font-size="20" font-weight="650" text-anchor="middle">ИЗМЕНИТЬ ПЕРЕМЕННЫЕ</text><line x1="480" y1="172" x2="480" y2="207" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="480" y1="277" x2="480" y2="312" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M480 377 L480 405 L695 405 L695 243 L615 243" stroke="#ffcb81" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><text x="617" y="390" fill="#ffcb81" font-size="17" font-weight="500">повтор</text><path d="M348 243 L204 243 L204 370" stroke="#61c7d3" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><text x="223" y="225" fill="#61c7d3" font-size="18" font-weight="500">нет</text><text x="484" y="291" fill="#9ceac2" font-size="17" font-weight="500">да</text><text x="207" y="390" fill="#61c7d3" font-size="20" font-weight="500" text-anchor="middle">КОНЕЦ</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Проверяй, входит ли изменение переменной внутрь цикла.</text></svg>