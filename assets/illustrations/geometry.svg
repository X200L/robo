<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Масштаб и площадь">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Масштаб и площадь</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Если радиус вырос вдвое, площадь выросла в 4 раза.</text>
 <circle cx="222" cy="275" r="74" fill="#235348" stroke="#8ddfbb" stroke-width="4"/><line x1="222" y1="275" x2="296" y2="275" stroke="#ffcb81" stroke-width="4" stroke-dasharray="" marker-end=""/><text x="262.7" y="263" fill="#ffcb81" font-size="23" font-weight="500" text-anchor="middle">r</text><circle cx="493" cy="275" r="148" fill="#235348" stroke="#8ddfbb" stroke-width="4"/><line x1="493" y1="275" x2="641" y2="275" stroke="#ffcb81" stroke-width="4" stroke-dasharray="" marker-end=""/><text x="574.4" y="263" fill="#ffcb81" font-size="23" font-weight="500" text-anchor="middle">2r</text><rect x="700" y="152" width="193" height="217" rx="14" fill="#193a3a" stroke="#44736d" stroke-width="2"/><text x="796" y="202" fill="#a8c0c9" font-size="19" font-weight="500" text-anchor="middle">ДЛИНА</text><text x="796" y="243" fill="#9ceac2" font-size="29" font-weight="800" text-anchor="middle">× 2</text><text x="796" y="293" fill="#a8c0c9" font-size="18" font-weight="500" text-anchor="middle">ПЛОЩАДЬ</text><text x="796" y="337" fill="#ffcb81" font-size="29" font-weight="800" text-anchor="middle">× 4</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Масса объёмного тела при одинаковой плотности растёт как r³.</text></svg>