<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Углы и радианы">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Углы и радианы</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Длина дуги s = R · θ при θ в радианах.</text>
 <circle cx="286" cy="274" r="146" fill="#172c34" stroke="#4e7180" stroke-width="3"/><line x1="99" y1="274" x2="480" y2="274" stroke="#627c88" stroke-width="2" stroke-dasharray="" marker-end=""/><line x1="286" y1="441" x2="286" y2="101" stroke="#627c88" stroke-width="2" stroke-dasharray="" marker-end=""/><path d="M286 274 L390 171" stroke="#9ceac2" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M340 274 A54 54 0 0 0 324 236" stroke="#ffcb81" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end=""/><text x="353" y="252" fill="#ffcb81" font-size="21" font-weight="500">45°</text><text x="406" y="165" fill="#9ceac2" font-size="18" font-weight="500">(cos θ, sin θ)</text><text x="466" y="270" fill="#a8c0c9" font-size="18" font-weight="500">x</text><text x="295" y="126" fill="#a8c0c9" font-size="18" font-weight="500">y</text><rect x="572" y="155" width="330" height="66" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="610" y="198" fill="#ebf8f4" font-size="24" font-weight="500">90°</text><text x="842" y="198" fill="#9ceac2" font-size="25" font-weight="500" text-anchor="end">π / 2</text><rect x="572" y="240" width="330" height="66" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="610" y="283" fill="#ebf8f4" font-size="24" font-weight="500">180°</text><text x="842" y="283" fill="#9ceac2" font-size="25" font-weight="500" text-anchor="end">π</text><rect x="572" y="325" width="330" height="66" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="610" y="368" fill="#ebf8f4" font-size="24" font-weight="500">360°</text><text x="842" y="368" fill="#9ceac2" font-size="25" font-weight="500" text-anchor="end">2π</text><text x="40" y="458" font-size="14" fill="#a8c0c9">1 оборот = 360° = 2π рад; для векторов используй компоненты.</text></svg>