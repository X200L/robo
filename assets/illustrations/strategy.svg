<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Стратегия решения">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Стратегия решения</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Применяй один и тот же алгоритм к каждой задаче.</text>
 <rect x="42" y="165" width="195" height="138" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="66" y="200" fill="#61c7d3" font-size="18" font-weight="500">01</text><text x="140" y="253" fill="#ebf8f4" font-size="23" font-weight="750" text-anchor="middle">ДАНО</text><line x1="239" y1="234" x2="271" y2="234" stroke="#9ceac2" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="274" y="165" width="195" height="138" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="298" y="200" fill="#61c7d3" font-size="18" font-weight="500">02</text><text x="372" y="253" fill="#ebf8f4" font-size="23" font-weight="750" text-anchor="middle">МОДЕЛЬ</text><line x1="471" y1="234" x2="503" y2="234" stroke="#9ceac2" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="506" y="165" width="195" height="138" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="530" y="200" fill="#61c7d3" font-size="18" font-weight="500">03</text><text x="604" y="253" fill="#ebf8f4" font-size="23" font-weight="750" text-anchor="middle">ФОРМУЛА</text><line x1="703" y1="234" x2="735" y2="234" stroke="#9ceac2" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="738" y="165" width="195" height="138" rx="14" fill="#172d35" stroke="#2d4350" stroke-width="2"/><text x="762" y="200" fill="#61c7d3" font-size="18" font-weight="500">04</text><text x="836" y="253" fill="#ebf8f4" font-size="23" font-weight="750" text-anchor="middle">ОТВЕТ</text><rect x="245" y="338" width="470" height="74" rx="14" fill="#1b3b35" stroke="#426b60" stroke-width="2"/><text x="480" y="381" fill="#9ceac2" font-size="23" font-weight="700" text-anchor="middle">ПРОВЕРЬ ЕДИНИЦЫ И ЗНАК</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Сначала модель и формула, потом числа.</text></svg>