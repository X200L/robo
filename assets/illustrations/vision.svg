<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Проекция камеры">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Проекция камеры</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Модель тонкой камеры: изображение уменьшается с расстоянием.</text>
 <line x1="450" y1="134" x2="450" y2="411" stroke="#61c7d3" stroke-width="4" stroke-dasharray="" marker-end=""/><circle cx="450" cy="280" r="8" fill="#ffcb81" stroke="#ffcb81" stroke-width="3"/><line x1="175" y1="157" x2="175" y2="387" stroke="#9ceac2" stroke-width="7" stroke-dasharray="" marker-end=""/><line x1="761" y1="195" x2="761" y2="365" stroke="#ff8f82" stroke-width="7" stroke-dasharray="" marker-end=""/><path d="M175 157 L450 280 L761 365" stroke="#9ceac2" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-end=""/><path d="M175 387 L450 280 L761 195" stroke="#9ceac2" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="9 8" marker-end=""/><text x="174" y="140" fill="#9ceac2" font-size="22" font-weight="500" text-anchor="middle">Объект H</text><text x="451" y="123" fill="#61c7d3" font-size="20" font-weight="500" text-anchor="middle">Камера</text><text x="761" y="183" fill="#ff8f82" font-size="20" font-weight="500" text-anchor="middle">Изображение h</text><text x="306" y="439" fill="#a8c0c9" font-size="18" font-weight="500" text-anchor="middle">Z — расстояние до объекта</text><text x="611" y="439" fill="#a8c0c9" font-size="18" font-weight="500" text-anchor="middle">f — фокусный параметр</text><text x="480" y="104" fill="#ffcb81" font-size="25" font-weight="750" text-anchor="middle">h = f·H/Z</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Размер в пикселях пропорционален размеру объекта и 1/Z.</text></svg>