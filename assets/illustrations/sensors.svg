<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-label="Датчики линии">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="500" rx="27" fill="#10222b"/><rect width="960" height="500" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Датчики линии</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Пара отражательных датчиков помогает удерживать чёрную линию.</text>
 <rect x="58" y="270" width="844" height="134" rx="11" fill="#cfd6d9" stroke="#8d9ca6" stroke-width="3"/><rect x="406" y="270" width="156" height="134" rx="0" fill="#17202a" stroke="#35404c" stroke-width="0"/><rect x="256" y="145" width="84" height="46" rx="14" fill="#244846" stroke="#6fafa0" stroke-width="2"/><ellipse cx="298" cy="215" rx="18" ry="14" fill="#75d4cc" stroke="#aed9d3" stroke-width="3"/><line x1="298" y1="225" x2="298" y2="275" stroke="#61c7d3" stroke-width="3" stroke-dasharray="8 7" marker-end=""/><text x="298" y="130" fill="#ebf8f4" font-size="20" font-weight="500" text-anchor="middle">Белая зона</text><rect x="604" y="145" width="84" height="46" rx="14" fill="#244846" stroke="#6fafa0" stroke-width="2"/><ellipse cx="646" cy="215" rx="18" ry="14" fill="#75d4cc" stroke="#aed9d3" stroke-width="3"/><line x1="646" y1="225" x2="646" y2="275" stroke="#ffcb81" stroke-width="3" stroke-dasharray="8 7" marker-end=""/><text x="646" y="130" fill="#ebf8f4" font-size="20" font-weight="500" text-anchor="middle">Чёрная линия</text><text x="480" y="452" fill="#9ceac2" font-size="19" font-weight="500" text-anchor="middle">Разница отражённого ИК-света → ошибка положения → коррекция скорости колёс</text><text x="40" y="478" font-size="14" fill="#a8c0c9">Порог устанавливай по калибровке на реальном покрытии.</text></svg>