 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Дифференциальный привод</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Почему формула зависит от центра поворота.</text>
 <rect x="48" y="116" width="416" height="307" rx="14" fill="#142932" stroke="#344a54" stroke-width="2"/><text x="256" y="155" fill="#ebf8f4" font-size="22" font-weight="700" text-anchor="middle">Танковый поворот</text><rect x="174" y="209" width="164" height="143" rx="18" fill="#245045" stroke="#73b8a7" stroke-width="2"/><rect x="148" y="232" width="23" height="98" rx="5" fill="#314452" stroke="#72c8d3" stroke-width="2"/><rect x="341" y="232" width="23" height="98" rx="5" fill="#314452" stroke="#72c8d3" stroke-width="2"/><circle cx="256" cy="282" r="10" fill="#0b191e" stroke="#9ceac2" stroke-width="3"/><text x="157" y="376" fill="#61c7d3" font-size="19" font-weight="500" text-anchor="middle">L</text><text x="355" y="376" fill="#61c7d3" font-size="19" font-weight="500" text-anchor="middle">R</text><path d="M118 219 Q93 282 118 347" stroke="#ffcb81" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><path d="M393 344 Q417 281 393 220" stroke="#ffcb81" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="495" y="116" width="416" height="307" rx="14" fill="#142932" stroke="#344a54" stroke-width="2"/><text x="703" y="155" fill="#ebf8f4" font-size="22" font-weight="700" text-anchor="middle">Один мотор стоит</text><rect x="621" y="209" width="164" height="143" rx="18" fill="#245045" stroke="#73b8a7" stroke-width="2"/><rect x="595" y="232" width="23" height="98" rx="5" fill="#314452" stroke="#72c8d3" stroke-width="2"/><rect x="788" y="232" width="23" height="98" rx="5" fill="#314452" stroke="#72c8d3" stroke-width="2"/><circle cx="703" cy="282" r="10" fill="#0b191e" stroke="#9ceac2" stroke-width="3"/><text x="604" y="376" fill="#61c7d3" font-size="19" font-weight="500" text-anchor="middle">L</text><text x="802" y="376" fill="#61c7d3" font-size="19" font-weight="500" text-anchor="middle">R</text><circle cx="606" cy="281" r="6" fill="#ffcb81" stroke="#ffcb81" stroke-width="3"/><text x="623" y="199" fill="#ffcb81" font-size="15" font-weight="500">ось поворота</text><path d="M840 346 Q896 267 841 209" stroke="#9ceac2" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="" marker-end="url(#arrow)"/><text x="480" y="450" fill="#9ceac2" font-size="20" font-weight="500" text-anchor="middle">Танковый: α колеса = θ·B/D    ·    Стоит колесо: α = 2θ·B/D</text><text x="40" y="478" font-size="14" fill="#a8c0c9">B — колея, D — диаметр колеса, θ — поворот корпуса.</text></svg>