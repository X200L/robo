 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Путь по графику скорости</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Положительная и отрицательная скорость дают положительный путь.</text>
