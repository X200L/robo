<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Рычаг и моменты">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Рычаг и моменты</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Сравнивай не массы, а силы с плечами от точки опоры.</text>
 <line x1="110" y1="254" x2="846" y2="254" stroke="#ebf8f4" stroke-width="14" stroke-dasharray="" marker-end=""/><polygon points="477,264 439,331 515,331" fill="#4d6472" stroke="#a5c5cc" stroke-width="3"/><line x1="260" y1="254" x2="260" y2="367" stroke="#ffcb81" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="715" y1="254" x2="715" y2="369" stroke="#61c7d3" stroke-width="5" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="260" y1="208" x2="475" y2="208" stroke="#ffcb81" stroke-width="2" stroke-dasharray="" marker-end=""/><line x1="475" y1="208" x2="715" y2="208" stroke="#61c7d3" stroke-width="2" stroke-dasharray="" marker-end=""/><text x="368" y="195" fill="#ffcb81" font-size="21" font-weight="500" text-anchor="middle">L₁</text><text x="596" y="195" fill="#61c7d3" font-size="21" font-weight="500" text-anchor="middle">L₂</text><text x="254" y="396" fill="#ffcb81" font-size="21" font-weight="500">m₁g</text><text x="711" y="396" fill="#61c7d3" font-size="21" font-weight="500">m₂g</text><text x="476" y="369" fill="#a8c0c9" font-size="18" font-weight="500" text-anchor="middle">опора</text><text x="480" y="133" fill="#9ceac2" font-size="27" font-weight="700" text-anchor="middle">m₁g · L₁ = m₂g · L₂</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Сила на длинном плече создаёт больший момент.</text></svg>