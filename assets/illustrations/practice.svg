<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Робот-инспектор склада">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Робот-инспектор склада</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Схема логики выполнения, не геометрия оригинального полигона.</text>
 <rect x="44" y="150" width="197" height="110" rx="14" fill="#20423a" stroke="#447d6b" stroke-width="2"/><text x="141" y="185" fill="#61c7d3" font-size="18" font-weight="500" text-anchor="middle">1</text><text x="141" y="226" fill="#ebf8f4" font-size="19" font-weight="700" text-anchor="middle">СТАРТ</text><line x1="243" y1="204" x2="275" y2="204" stroke="#9ceac2" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="278" y="150" width="197" height="110" rx="14" fill="#20423a" stroke="#447d6b" stroke-width="2"/><text x="375" y="185" fill="#61c7d3" font-size="18" font-weight="500" text-anchor="middle">2</text><text x="375" y="226" fill="#ebf8f4" font-size="19" font-weight="700" text-anchor="middle">ОБЪЕЗД 0–9</text><line x1="477" y1="204" x2="509" y2="204" stroke="#9ceac2" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="512" y="150" width="197" height="110" rx="14" fill="#20423a" stroke="#447d6b" stroke-width="2"/><text x="609" y="185" fill="#61c7d3" font-size="18" font-weight="500" text-anchor="middle">3</text><text x="609" y="226" fill="#ebf8f4" font-size="19" font-weight="700" text-anchor="middle">ОСМОТР</text><line x1="711" y1="204" x2="743" y2="204" stroke="#9ceac2" stroke-width="3" stroke-dasharray="" marker-end="url(#arrow)"/><rect x="746" y="150" width="197" height="110" rx="14" fill="#20423a" stroke="#447d6b" stroke-width="2"/><text x="843" y="185" fill="#61c7d3" font-size="18" font-weight="500" text-anchor="middle">4</text><text x="843" y="226" fill="#ebf8f4" font-size="19" font-weight="700" text-anchor="middle">ФИНИШ</text><rect x="145" y="309" width="670" height="91" rx="14" fill="#2b3830" stroke="#5b7554" stroke-width="2"/><text x="480" y="342" fill="#ffcb81" font-size="20" font-weight="500" text-anchor="middle">1 кубик → вытолкнуть    ·    2–3 кубика → не трогать</text><text x="480" y="373" fill="#9ceac2" font-size="18" font-weight="500" text-anchor="middle">LED 1 / 2 / 3 = чётность сумм исходных номеров зон</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Для практики обязательны остановки ≥1 секунды на каждой зоне.</text></svg>