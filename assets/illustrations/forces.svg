<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img" aria-label="Силы на наклонной плоскости">
 <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M 30 0 L 0 0 0 30" fill="none" stroke="#2d4350" stroke-width=".75" opacity=".42"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#9ceac2" /></marker></defs>
 <rect width="960" height="480" rx="27" fill="#10222b"/><rect width="960" height="480" rx="27" fill="url(#grid)"/>
 <text x="40" y="50" fill="#ebf8f4" font-size="27" font-weight="750">Силы на наклонной плоскости</text><text x="40" y="80" fill="#a8c0c9" font-size="16" font-weight="500">Разложи силу тяжести относительно наклонной поверхности.</text>
 <polygon points="160,381 570,381 570,166" fill="#203d42" stroke="#466a75" stroke-width="3"/><line x1="160" y1="381" x2="570" y2="166" stroke="#61c7d3" stroke-width="6" stroke-dasharray="" marker-end=""/><g transform="translate(390,260) rotate(-28)"><rect x="-53" y="-50" width="106" height="82" rx="9" fill="#31584d" stroke="#9ceac2" stroke-width="3"/></g><line x1="390" y1="260" x2="390" y2="413" stroke="#ffcb81" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="390" y1="260" x2="535" y2="179" stroke="#9ceac2" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><line x1="390" y1="260" x2="340" y2="169" stroke="#61c7d3" stroke-width="4" stroke-dasharray="" marker-end="url(#arrow)"/><text x="408" y="411" fill="#ffcb81" font-size="22" font-weight="500">mg</text><text x="526" y="168" fill="#9ceac2" font-size="20" font-weight="500">тяга F</text><text x="287" y="160" fill="#61c7d3" font-size="23" font-weight="500">N</text><text x="585" y="283" fill="#ebf8f4" font-size="20" font-weight="500">mg · sin α вдоль склона</text><text x="585" y="320" fill="#ebf8f4" font-size="20" font-weight="500">μmg · cos α — трение</text><text x="40" y="458" font-size="14" fill="#a8c0c9">Для подъёма с постоянной скоростью F = mg·sinα + μmg·cosα.</text></svg>